<text x="525.6" y="183.787" font-family="Microsoft YaHei, Microsoft YaHei UI, SimHei, sans-serif" font-size="12" font-weight="normal" fill="#a79883" text-anchor="start">17 px 粗体，左上角，单行</text>
<line x1="449.6" y1="149.909" x2="509.6" y2="149.909" stroke="#f2dc9e" stroke-width="1" stroke-dasharray="4 3"/>
