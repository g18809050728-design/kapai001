<text x="525.6" y="152.909" font-family="Microsoft YaHei, Microsoft YaHei UI, SimHei, sans-serif" font-size="15" font-weight="bold" fill="#ece3d4" text-anchor="start">② 费用徽章</text>
<text x="525.6" y="169.509" font-family="Microsoft YaHei, Microsoft YaHei UI, SimHei, sans-serif" font-size="12" font-weight="normal" fill="#a79883" text-anchor="start">免费牌也显示 0；能量不足时置灰并给出原因</text>
<line x1="449.6" y1="205.787" x2="509.6" y2="205.787" stroke="#f2dc9e" stroke-width="1" stroke-dasharray="4 3"/>
<circle cx="509.6" cy="205.787" r="3" fill="#f2dc9e" stroke="none" stroke-width="0"/>
