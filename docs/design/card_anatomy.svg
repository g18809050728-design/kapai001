<line x1="449.6" y1="301.04" x2="509.6" y2="301.04" stroke="#f2dc9e" stroke-width="1" stroke-dasharray="4 3"/>
<circle cx="509.6" cy="301.04" r="3" fill="#f2dc9e" stroke="none" stroke-width="0"/>
<text x="525.6" y="304.04" font-family="Microsoft YaHei, Microsoft YaHei UI, SimHei, sans-serif" font-size="15" font-weight="bold" fill="#ece3d4" text-anchor="start">⑤ 完整效果描述</text>
<text x="525.6" y="320.64" font-family="Microsoft YaHei, Microsoft YaHei UI, SimHei, sans-serif" font-size="12" font-weight="normal" fill="#a79883" text-anchor="start">13 px，自动换行，不截断、不用省略号</text>
<line x1="449.6" y1="474.928" x2="509.6" y2="474.928" stroke="#f2dc9e" stroke-width="1" stroke-dasharray="4 3"/>
<circle cx="509.6" cy="474.928" r="3" fill="#f2dc9e" stroke="none" stroke-width="0"/>
<text x="525.6" y="477.928" font-family="Microsoft YaHei, Microsoft YaHei UI, SimHei, sans-serif" font-size="15" font-weight="bold" fill="#ece3d4" text-anchor="start">⑥ 不可用原因</text>
<text x="525.6" y="494.528" font-family="Microsoft YaHei, Microsoft YaHei UI, SimHei, sans-serif" font-size="12" font-weight="normal" fill="#a79883" text-anchor="start">12 px 警告色；仅在该牌当前不可用时出现</text>
<text x="36" y="632" font-family="Microsoft YaHei, Microsoft YaHei UI, SimHei, sans-serif" font-size="13" font-weight="normal" fill="#a79883" text-anchor="start">交互尺寸（规格 §5.1）：整张卡为点击热区 148 × 208；悬停放大到 1.14 倍并提升 z 序；相邻卡重叠时，悬停卡始终在最上层。</text>
<text x="36" y="654" font-family="Microsoft YaHei, Microsoft YaHei UI, SimHei, sans-serif" font-size="13" font-weight="normal" fill="#ece3d4" text-anchor="start">文字层级：名称 17px / 费用 15px / 类型 12px / 效果 13px / 原因 12px。</text>
</svg>
