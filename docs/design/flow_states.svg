<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540">
<rect width="1100" height="540" fill="#171310"/>
<text x="36" y="45.6" font-family="Microsoft YaHei, Microsoft YaHei UI, SimHei, sans-serif" font-size="27" font-weight="bold" fill="#ece3d4" text-anchor="start">界面状态流转 · UI State Flow</text>
<text x="36" y="69.2" font-family="Microsoft YaHei, Microsoft YaHei UI, SimHei, sans-serif" font-size="14" font-weight="normal" fill="#a79883" text-anchor="start">对应规格 §10.1 状态机；方块下标注该阶段输入是否可用</text>
<line x1="36" y1="82" x2="1064" y2="82" stroke="#57493b" stroke-width="1"/>
