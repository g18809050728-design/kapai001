server {
    listen 127.0.0.1:18080;
    server_name localhost;
    root /var/www/kapai001/current;
    index index.html;

    gzip_static on;
    gzip_vary on;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
