[preset.0]

name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="data/*.json,assets/art/*.json,assets/fonts/OFL.txt"
exclude_filter="tests/*,tools/*,artifacts/*,assets/g6/*,docs/*,output/*,ui-plan/*,web/*"
export_path="dist/web/index.html"

[preset.0.options]

variant/extensions_support=false
variant/thread_support=false
html/head_include="<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<link rel=\"stylesheet\" href=\"game-shell.css\">\n<script defer src=\"game-shell.js\"></script>"
html/canvas_resize_policy=0
html/experimental_virtual_keyboard=true
progressive_web_app/enabled=false
