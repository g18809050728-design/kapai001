<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
        }
    </style>
</head>
<body>
    
        <script nonce="" type="text/javascript" src="https://assetstore-cdn-china.unitychina.cn/vjs/video.min.js"></script>
<script nonce="" type="text/javascript" src="https://assetstore-cdn-china.unitychina.cn/vjs/videojs-hlsjs-plugin.js"></script>
<script nonce="" type="text/javascript" src="https://assetstore-cdn-china.unitychina.cn/vjs/videojs.hotkeys.js"></script>
<!-- script nonce="" type="text/javascript" src="https://assetstore-cdn-china.unitychina.cn/vjs/videojs-vtt-thumbnails.min.js"></script -->
<!-- script nonce="" type="text/javascript" src="https://assetstore-cdn-china.unitychina.cn/vjs/videojs-seek-buttons.min.js"></script -->
<script nonce="" type="text/javascript" src="https://assetstore-cdn-china.unitychina.cn/vjs/vjs-quality-picker.js"></script>
<link rel="stylesheet" href="https://assetstore-cdn-china.unitychina.cn/vjs/video-js-cdn.min.css">
<link rel="stylesheet" href="https://assetstore-cdn-china.unitychina.cn/vjs/skin-cyan.css">
<!-- link rel="stylesheet" href="https://assetstore-cdn-china.unitychina.cn/vjs/videojs-vtt-thumbnails.css" -->
<!-- link rel="stylesheet" href="https://assetstore-cdn-china.unitychina.cn/vjs/videojs-seek-buttons.css" -->
<video id='my-video'
       class='video-js vjs-default-skin vjs-big-play-centered'
       controls
       muted
       autoplay=''
       preload='auto'
       poster='https://assetstore-cdn-china.unitychina.cn/20260609/videos/878cd5dd-3877-4be6-b4f7-8f7ce76452ac/thumbnail.png'
       data-setup='{}'>
    <script nonce="" type="text/javascript">
  
        var player = videojs('my-video',{
        html5: {
            hlsjsConfig: {
                autoStartLoad: '' === 'autoplay',
                maxBufferLength: 16,
                maxMaxBufferLength: 32,
                maxBufferSize: 30*1000*1000,
                appendErrorMaxRetry: 5,
                startFragPrefetch: false,
                capLevelToPlayerSize: true,
                fragLoadingTimeOut: 8000,
                fragLoadingMaxRetry: 10,
                manifestLoadingTimeOut : 10000,
                manifestLoadingMaxRetry : 5
            }
        },
        controls: true,
        controlBar: {
            currentTimeDisplay:true,
            remainingTimeDisplay:true,
            timeDivider:false,
            durationDisplay:false
        }
        }, function(){
            this.hotkeys({
                volumeStep: 0.1,
                seekStep: 15,
                enableModifiersForNumbers: false,
                alwaysCaptureHotkeys: true
            });
        });
        // player.seekButtons({
        //     forward: 10,
        //     back: 15
        // });
        player.qualityPickerPlugin();
        player.src({
            type: 'application/x-mpegURL',
            src: '/playlist/6a283e5c474ba317dfb461a9'});
  </script>

</video>

<style>
    .video-js {
        position: fixed;
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
    }
</style>
    
</body>
</html>
