server {
    listen 127.0.0.1:18443 ssl;
    server_name localhost;
    ssl_certificate /etc/kapai001/stage-cert.pem;
    ssl_certificate_key /etc/kapai001/stage-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/kapai001/staging/admin-developer-tools-20261121;
    index index.html;
    gzip_static on;
    gzip_vary on;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;

    location ^~ /game-assets/ {
        gzip_static always;
        gunzip on;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /api/v1/ {
        client_max_body_size 10m;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:18444;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
