server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 47.93.245.237;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/kapai001/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://47.93.245.237$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 47.93.245.237;
    ssl_certificate /etc/letsencrypt/live/kapai001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kapai001/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/kapai001/current;
    index index.html;
    gzip_static on;
    gzip_vary on;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;

    location ^~ /api/v1/ {
        client_max_body_size 10m;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:18445;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
